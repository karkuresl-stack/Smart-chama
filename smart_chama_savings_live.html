
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Chama - Live Savings</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f6f3;color:#173b2a;margin:0;padding:20px}
header,.card{max-width:850px;margin:16px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001}
h1{margin:0 0 8px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5ce;border-radius:7px;font-size:16px}
button{background:#176b43;color:white;border:0;font-weight:bold}
small{color:#56675c}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}.status{padding:10px;background:#edf5ef;border-radius:7px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>Smart Chama</h1>
<p>Live Savings Management</p>
<div class="status" id="connection">Connecting to Supabase...</div>
</header>

<section class="card">
<h2>Submit a deposit</h2>
<p><small>Deposits submitted here remain pending until approved under the group's authorised process.</small></p>
<form id="depositForm">
<label for="amount">Amount (KES)</label>
<input id="amount" type="number" min="1" step="0.01" required>
<label for="reference">Payment reference (optional)</label>
<input id="reference" maxlength="100" placeholder="e.g. M-Pesa transaction code">
<button id="submitBtn" type="submit">Submit Pending Deposit</button>
</form>
<p id="formMessage"></p>
</section>

<section class="card">
<h2>My savings transactions</h2>
<button id="refreshBtn" type="button">Refresh Transactions</button>
<p id="historyMessage">Loading transactions...</p>
<div class="tablewrap">
<table>
<thead><tr><th>Date</th><th>Amount (KES)</th><th>Type</th><th>Status</th><th>Reference</th></tr></thead>
<tbody id="transactions"></tbody>
</table>
</div>
</section>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const connection = document.getElementById("connection");
const formMessage = document.getElementById("formMessage");
const historyMessage = document.getElementById("historyMessage");
const submitBtn = document.getElementById("submitBtn");
const tbody = document.getElementById("transactions");

let client = null;
let currentUser = null;

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function loadTransactions() {
  if (!client || !currentUser) return;

  historyMessage.textContent = "Loading transactions...";
  tbody.innerHTML = "";

  const { data, error } = await client
    .from("savings_transactions")
    .select("id, amount, transaction_type, transaction_date, reference, status")
    .eq("member_id", currentUser.id)
    .order("transaction_date", { ascending: false })
    .limit(100);

  if (error) {
    historyMessage.textContent = "Could not load transactions: " + error.message;
    return;
  }

  historyMessage.textContent = data.length
    ? "Showing your latest transactions."
    : "No transactions are visible for this account yet.";

  tbody.innerHTML = data.map(t => `
    <tr>
      <td>${safeText(t.transaction_date ? new Date(t.transaction_date).toLocaleDateString() : "")}</td>
      <td>${safeText(Number(t.amount).toFixed(2))}</td>
      <td>${safeText(t.transaction_type)}</td>
      <td>${safeText(t.status)}</td>
      <td>${safeText(t.reference || "—")}</td>
    </tr>
  `).join("");
}

async function start() {
  if (!window.supabase) {
    connection.textContent = "Supabase library failed to load. Check your internet connection and reload.";
    return;
  }

  if (SUPABASE_URL.includes( 'https://kbrhjgnwbkszmjldbfor.supabase.co';) ||
      SUPABASE_KEY.includes('sb_publishable__Tck9HRnjrqdLdbpH36YPQ_-7vpek8B';)) {
    connection.textContent = "Setup required: add the Supabase project URL and publishable key.";
    return;
  }

  client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const { data, error } = await client.auth.getSession();
  if (error) {
    connection.textContent = "Could not check sign-in: " + error.message;
    return;
  }

  currentUser = data.session?.user || null;
  if (!currentUser) {
    connection.textContent = "Please sign in first through Member Access.";
    return;
  }

  connection.textContent = "Signed in. Checking database access...";
  await loadTransactions();
  if (historyMessage.textContent.startsWith("Could not load")) {
    connection.textContent = "Signed in, but database access needs attention.";
  } else {
    connection.textContent = "Signed in. Savings database read test completed.";
  }
}

document.getElementById("depositForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!client || !currentUser) {
    formMessage.textContent = "Sign in through Member Access first.";
    return;
  }

  const amount = Number(document.getElementById("amount").value);
  const reference = document.getElementById("reference").value.trim();

  if (!Number.isFinite(amount) || amount <= 0) {
    formMessage.textContent = "Enter a valid amount greater than zero.";
    return;
  }

  submitBtn.disabled = true;
  formMessage.textContent = "Submitting pending deposit...";

  const { error } = await client.from("savings_transactions").insert({
    member_id: currentUser.id,
    amount,
    transaction_type: "deposit",
    reference: reference || null,
    status: "pending"
  });

  submitBtn.disabled = false;

  if (error) {
    formMessage.textContent =
      "Deposit was not saved: " + error.message +
      ". No balance has been changed.";
    return;
  }

  formMessage.textContent =
    "Pending deposit submitted. It is not yet an approved savings balance.";
  document.getElementById("amount").value = "";
  document.getElementById("reference").value = "";
  await loadTransactions();
});

document.getElementById("refreshBtn").addEventListener("click", loadTransactions);

start().catch(error => {
  connection.textContent = "Unexpected error: " + error.message;
});
</script>
</body>
</html>
