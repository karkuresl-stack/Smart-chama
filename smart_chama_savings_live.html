
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Chama - Live Savings</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f6f3;color:#173b2a;margin:0;padding:12px}
header,.card{max-width:850px;margin:16px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001}
h1{margin:0 0 8px}
input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5ce;border-radius:7px;font-size:16px}
button{background:#176b43;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
small{color:#56675c}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}
.status{padding:10px;background:#edf5ef;border-radius:7px;overflow-wrap:anywhere;line-height:1.5}
.error{background:#fff0ef;color:#922}
</style>
</head>
<body>
<header>
<h1>Smart Chama</h1>
<p>Live Savings Management</p>
<div class="status" id="connection">Connecting securely...</div>
</header>

<section class="card">
<h2>Submit a deposit</h2>
<p><small>Deposits remain pending until approved by an authorized officer.</small></p>
<form id="depositForm">
<label for="amount">Amount (KES)</label>
<input id="amount" type="number" min="1" max="100000000" step="0.01" required>
<label for="reference">Payment reference (optional)</label>
<input id="reference" maxlength="100" placeholder="e.g. M-Pesa transaction code">
<button id="submitBtn" type="submit" disabled>Submit Pending Deposit</button>
</form>
<p id="formMessage" class="status" role="status" aria-live="polite"></p>
</section>

<section class="card">
<h2>My savings transactions</h2>
<button id="refreshBtn" type="button" disabled>Refresh Transactions</button>
<p id="historyMessage">Checking your membership...</p>
<div class="tablewrap">
<table>
<thead><tr><th>Date</th><th>Amount (KES)</th><th>Type</th><th>Status</th><th>Reference</th></tr></thead>
<tbody id="transactions"></tbody>
</table>
</div>
</section>

<script type="module">
const SUPABASE_URL = "https://kbrhjgnwbkszmjldbfor.supabase.co";
const SUPABASE_KEY = "sb_publishable__Tck9HRnjrqdLdbpH36YPQ_-7vpek8B";

const $ = id => document.getElementById(id);
let db = null;
let user = null;
let membership = null;
let busy = false;

function say(id, text, error = false) {
  $(id).textContent = text;
  $(id).classList.toggle("error", error);
}

function withTimeout(promise, label, ms = 12000) {
  let timer;
  return Promise.race([
    promise,
    new Promise((_, reject) => {
      timer = setTimeout(
        () => reject(new Error(label + " timed out. Check your connection and retry.")),
        ms
      );
    })
  ]).finally(() => clearTimeout(timer));
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

async function loadTransactions() {
  if (!db || !user || !membership) return;

  $("refreshBtn").disabled = true;
  say("historyMessage", "Loading transactions...");
  $("transactions").replaceChildren();

  try {
    const { data: authData, error: authError } =
      await withTimeout(db.auth.getUser(), "Verifying your session");

    if (authError || !authData.user || authData.user.id !== user.id) {
      throw new Error("Your sign-in session could not be verified. Sign in again.");
    }

    const { data, error } = await withTimeout(
      db.from("savings_transactions")
        .select("id, amount, transaction_type, transaction_date, reference, status")
      .eq("member_id", user.id)
        .order("transaction_date", { ascending: false })
        .limit(100),
      "Loading savings history"
    );

    if (error) throw error;

    const rows = data || [];
    say("historyMessage", rows.length
      ? "Showing your latest transactions."
      : "No transactions are visible for this membership yet.");

    $("transactions").innerHTML = rows.map(t => `
      <tr>
        <td>${safe(t.transaction_date ? new Date(t.transaction_date).toLocaleDateString() : "")}</td>
        <td>${safe(Number(t.amount).toFixed(2))}</td>
        <td>${safe(t.transaction_type)}</td>
        <td>${safe(t.status)}</td>
        <td>${safe(t.reference || "—")}</td>
      </tr>
    `).join("");
  } catch (error) {
    say("historyMessage", "Could not load transactions: " +
      (error.message || String(error)), true);
  } finally {
    $("refreshBtn").disabled = false;
  }
}

async function start() {
  try {
    const { createClient } =
      await import("https://esm.sh/@supabase/supabase-js@2");
    db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data: authData, error: authError } =
      await withTimeout(db.auth.getUser(), "Checking sign-in");

    if (authError) throw authError;
    user = authData.user;

    if (!user) {
      say("connection", "Please sign in through Member Access first.", true);
      say("historyMessage", "Sign in to view your savings transactions.");
      $("historyMessage").innerHTML =
        'Sign in through <a href="smart_chama_supabase_ready-2.html">Member Access</a>.';
      return;
    }

    say("connection", "Signed in. Finding your active membership...");

    const { data: rows, error: membershipError } = await withTimeout(
      db.from("chama_members")
        .select("id, group_id, member_number, status")
        .eq("user_id", user.id)
        .eq("status", "active")
        .order("joined_at", { ascending: false }),
      "Finding active membership"
    );

    if (membershipError) throw membershipError;

    if (!rows || rows.length === 0) {
      say("connection", "No active membership found. Request membership and wait for approval.", true);
      say("historyMessage", "An active membership is required to access savings.");
      return;
    }
    if (rows.length > 1) {
      say("connection",
        "You belong to multiple active groups. This page needs a group selector before deposits can be submitted.", true);
      say("historyMessage",
        "No deposit was enabled to avoid assigning funds to the wrong group.");
      return;
    }

    membership = rows[0];
    $("submitBtn").disabled = false;
    $("refreshBtn").disabled = false;

    say("connection", "Ready · " + (user.email || user.id) +
      " · Membership " + (membership.member_number || membership.id));
    await loadTransactions();
  } catch (error) {
    say("connection", "Savings setup failed: " +
      (error.message || String(error)), true);
    say("historyMessage", "No deposit was submitted.", true);
  }
}

$("depositForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!db || !user || !membership || busy) {
    say("formMessage", "An active membership and verified sign-in are required.", true);
    return;
  }

  const amount = Number($("amount").value);
  const reference = $("reference").value.trim();

  if (!Number.isFinite(amount) || amount <= 0 || amount > 100000000) {
    say("formMessage", "Enter a valid positive amount within the permitted limit.", true);
    return;
  }

  busy = true;
  $("submitBtn").disabled = true;
  say("formMessage", "Verifying session and submitting a pending deposit...");

  try {
    const { data: authData, error: authError } =
      await withTimeout(db.auth.getUser(), "Verifying your session");

    if (authError || !authData.user || authData.user.id !== user.id) {
      throw new Error("Your session is no longer valid. Sign in again.");
    }

    const { data, error } = await withTimeout(
      db.rpc("submit_savings_deposit", {
        p_member_id: user.id,
        p_amount: amount,
        p_reference: reference || null
      }),
      "Submitting pending deposit"
    );

    if (error) throw error;

    say("formMessage",
      "Pending deposit submitted successfully. Transaction ID: " +
      String(data) + ". It is not yet an approved savings balance.");

    $("amount").value = "";
    $("reference").value = "";
    await loadTransactions();
  } catch (error) {
    say("formMessage",
      "Deposit was not saved: " + (error.message || String(error)) +
      ". No balance was changed.", true);
  } finally {
    busy = false;
    $("submitBtn").disabled = !membership;
  }
});

$("refreshBtn").addEventListener("click", loadTransactions);

start();
</script>
</body>
</html>
