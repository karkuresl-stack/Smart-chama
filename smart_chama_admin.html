
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Chama | Owner Administration</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f3;color:#18352b;font-family:Arial,sans-serif}
header{background:#123f30;color:white;padding:22px}
header h1{margin:0}
header p{margin-bottom:0;color:#d8eadf}
main{max-width:700px;margin:24px auto;padding:0 14px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 12px #0001}
h2{margin-top:0;font-size:20px}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #cbd8d0;border-radius:8px;font-size:16px}
textarea{min-height:85px}
button{border:0;border-radius:8px;padding:13px 16px;font-weight:bold;font-size:15px;cursor:pointer}
.primary{background:#176b4b;color:white}
.secondary{background:#e8f1eb;color:#18352b}
button:disabled{opacity:.5;cursor:not-allowed}
.status{padding:12px;background:#eef5ef;border-radius:8px;overflow-wrap:anywhere;line-height:1.5}
.small{font-size:13px;color:#627369;line-height:1.5}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
<h1>Smart Chama</h1>
<p>System Owner Administration</p>
</header>

<main>
<section class="card" id="authCard">
<h2>Owner sign-in</h2>
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="username"
placeholder="Your registered email">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password"
placeholder="Your password">
<p>
<button class="primary" id="loginBtn">Sign in</button>
<button class="secondary" id="logoutBtn" disabled>Sign out</button>
</p>
<div id="authStatus" class="status" role="status" aria-live="polite">
Verifying access...
</div>
</section>

<section class="card hidden" id="adminCard">
<h2>Create a chama</h2>
<p class="small">Verified system-owner access required.</p>
<label for="groupName">Chama name</label>
<input id="groupName" maxlength="120"
placeholder="e.g. Rising Stars SGH">
<label for="groupDescription">Description (optional)</label>
<textarea id="groupDescription" maxlength="1000"
placeholder="Purpose and details of the group"></textarea>
<p><button class="primary" id="createBtn" disabled>Create chama</button></p>
<div id="groupStatus" class="status" role="status" aria-live="polite">
Verify owner access before creating a group.
</div>
</section>

<p>
<button class="secondary" id="backBtn">Back to main system</button>
</p>
</main>

<script type="module">
const SUPABASE_URL = "https://kbrhjgnwbkszmjldbfor.supabase.co";
const SUPABASE_KEY = "sb_publishable__Tck9HRnjrqdLdbpH36YPQ_-7vpek8B";

const $ = id => document.getElementById(id);
let db = null;
let currentUser = null;
let isOwner = false;
let busy = false;
let checking = false;
let authVersion = 0;

function message(id, text) {
  $(id).textContent = text;
}

function showOwnerControls(allowed) {
  $("adminCard").classList.toggle("hidden", !allowed);
  $("createBtn").disabled = !allowed || busy;
}

function showSignedOut(text = "Sign in with your Smart Chama account.") {
  currentUser = null;
  isOwner = false;
  showOwnerControls(false);
  $("loginBtn").disabled = false;
  $("logoutBtn").disabled = true;
  $("password").value = "";
  message("authStatus", text);
  message("groupStatus", "Owner verification is required.");
}

async function verifyUser(user, version = authVersion) {
  currentUser = user;
  isOwner = false;
  showOwnerControls(false);

  $("loginBtn").disabled = true;
  $("logoutBtn").disabled = false;
  message("authStatus", "Checking system-owner permissions...");

  if (!user) {
    showSignedOut();
    return false;
  }

  try {
    const { data, error } = await db
      .from("smart_chama_system_admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (version !== authVersion) return false;

    if (error) {
      showOwnerControls(false);
      message("authStatus",
        "Owner verification failed. Access denied. " + error.message);
      $("loginBtn").disabled = false;
      $("logoutBtn").disabled = false;
      return false;
    }

    if (!data) {
      currentUser = user;
      isOwner = false;
      showOwnerControls(false);
      message("authStatus",
        "ACCESS DENIED: This account is not registered as the system owner.");
      message("groupStatus", "Only the registered system owner can create groups.");
      $("loginBtn").disabled = true;
      $("logoutBtn").disabled = false;
      return false;
    }

    currentUser = user;
    isOwner = true;
    showOwnerControls(true);
    message("authStatus", "Owner verified: " + (user.email || user.id));
    message("groupStatus", "Owner access verified. You may create a chama.");
    return true;
  } catch (err) {
    if (version !== authVersion) return false;
    showOwnerControls(false);
    message("authStatus",
      "Owner verification failed. Access denied. " +
      (err.message || "Please retry."));
    $("loginBtn").disabled = false;
    $("logoutBtn").disabled = false;
    return false;
  }
}

async function start() {
  $("loginBtn").disabled = true;
  showOwnerControls(false);

  try {
    const { createClient } =
      await import("https://esm.sh/@supabase/supabase-js@2");

    db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    if (data.session?.user) {
      await verifyUser(data.session.user);
    } else {
      showSignedOut();
    }

    db.auth.onAuthStateChange((event, session) => {
      if (event === "TOKEN_REFRESHED" || event === "USER_UPDATED") return;

      authVersion++;
      const version = authVersion;

      if (session?.user) {
        setTimeout(() => {
          if (version === authVersion) {
            verifyUser(session.user, version);
          }
        }, 0);
      } else {
        showSignedOut();
      }
    });
  } catch (err) {
    showOwnerControls(false);
    message("authStatus",
      "Could not connect to Supabase. Access remains blocked. " +
      (err.message || "Check your internet connection."));
    $("loginBtn").disabled = false;
  }
}

$("loginBtn").addEventListener("click", async () => {
  if (!db || checking) return;

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    message("authStatus", "Enter your email and password.");
    return;
  }

  checking = true;
  $("loginBtn").disabled = true;
  message("authStatus", "Signing in securely...");

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email, password
    });

    if (error) {
      showSignedOut("Sign-in failed: " + error.message);
      return;
    }

    authVersion++;
    await verifyUser(data.user, authVersion);
  } catch (err) {
    showSignedOut("Sign-in failed: " +
      (err.message || "Please try again."));
  } finally {
    checking = false;
    if (!currentUser) $("loginBtn").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  if (!db) return;

  $("logoutBtn").disabled = true;
  showOwnerControls(false);
  isOwner = false;

  try {
    const { error } = await db.auth.signOut();
    if (error) throw error;
    authVersion++;
    showSignedOut("You have signed out.");
  } catch (err) {
    message("authStatus", "Sign-out failed: " + err.message);
    $("logoutBtn").disabled = false;
  }
});

$("createBtn").addEventListener("click", async () => {
  if (!db || !currentUser || !isOwner || busy) return;

  // Re-check the current session and owner registry before every write.
  busy = true;
  $("createBtn").disabled = true;
  message("groupStatus", "Rechecking permissions...");

  try {
    const { data: sessionData, error: sessionError } =
      await db.auth.getUser();

    if (sessionError || !sessionData.user ||
        sessionData.user.id !== currentUser.id) {
      isOwner = false;
      showOwnerControls(false);
      message("groupStatus", "Session verification failed. Sign in again.");
      return;
    }

    const { data: ownerRecord, error: ownerError } = await db
      .from("smart_chama_system_admins")
      .select("user_id")
      .eq("user_id", sessionData.user.id)
      .maybeSingle();

    if (ownerError || !ownerRecord) {
      isOwner = false;
      showOwnerControls(false);
      message("groupStatus", "Access denied. Owner verification failed.");
      return;
    }

    const name = $("groupName").value.trim();
    const description = $("groupDescription").value.trim();

    if (!name) {
      message("groupStatus", "Enter a chama name first.");
      return;
    }

    message("groupStatus", "Creating group securely...");

    const { data, error } = await db.rpc("admin_create_chama_group", {
      p_name: name,
      p_description: description || null
    });

    if (error) {
      message("groupStatus", "Group was not created: " + error.message);
      return;
    }

    message("groupStatus", "Chama created successfully. Group ID: " +
      (typeof data === "string" ? data : JSON.stringify(data)));

    $("groupName").value = "";
    $("groupDescription").value = "";
  } catch (err) {
    message("groupStatus", "Creation failed: " +
      (err.message || "Please try again."));
  } finally {
    busy = false;
    $("createBtn").disabled = !isOwner || !currentUser;
  }
});

$("backBtn").addEventListener("click", () => {
  location.href = "smart_chama_main.html";
});

start();
</script>
</body>
</html>
