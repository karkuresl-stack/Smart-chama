name: Smart Chama Test-Branch Static Safety Checks

on:
  push:
    branches:
      - testing/isolated-member-access
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run static safety checks
        run: python -m unittest discover -s tests -v
