
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Chama - Membership Approvals</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#243247;font:16px Arial,sans-serif}
header{background:#103d30;color:white;padding:24px}
main{max-width:850px;margin:22px auto;padding:14px}
.card{background:white;border-radius:16px;padding:22px;margin-bottom:18px}
.notice{padding:14px;background:#eaf4ee;border-radius:10px;overflow-wrap:anywhere}
.error{background:#ffeded;color:#8c1d1d}
button,a{display:inline-block;padding:12px 15px;border:0;border-radius:10px;background:#17654c;color:white;text-decoration:none;font-weight:bold;margin:8px 6px 0 0}
.secondary{background:#e8f1ec;color:#103d30}
.danger{background:#a52d2d;color:white}
.request{border:1px solid #e0e7e3;border-radius:13px;padding:15px;margin:12px 0;overflow-wrap:anywhere}
.muted{color:#667085;line-height:1.5}
button:disabled{opacity:.55}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>Smart Chama</h1>
<p>Membership Approval Centre</p>
</header>
<main>
<section class="card">
<h2>Reviewer access</h2>
<div id="status" class="notice">Initializing secure access...</div>
<div id="reviewerControls" hidden>
<button id="refresh">Refresh requests</button>
</div>
<a class="secondary" href="smart_chama_main.html">Main System</a>
<a class="secondary" href="smart_chama_supabase_ready-2.html">Member Access / Sign in</a>
<a id="managementLink" class="secondary" href="smart_chama_group_management.html" hidden>Group Management</a>
</section>
<section class="card" id="requestsCard" hidden>
<h2>Pending membership requests</h2>
<p class="muted">Only authorized reviewers can view requests for their permitted groups.</p>
<div id="requests" class="notice">Loading requests...</div>
</section>
</main>
<script type="module">
const $=id=>document.getElementById(id);
const URL="https://kbrhjgnwbkszmjldbfor.supabase.co";
const KEY="sb_publishable__Tck9HRnjrqdLdbpH36YPQ_-7vpek8B";
let db=null,user=null,isOwner=false,reviewGroupIds=[];

function setStatus(message,isError=false){
 $("status").textContent=message;
 $("status").className="notice"+(isError?" error":"");
}
function timed(p,label,ms=12000){
 return Promise.race([p,new Promise((_,reject)=>
  setTimeout(()=>reject(new Error(label+" timed out")),ms))]);
}
function node(tag,text,cls){
 const n=document.createElement(tag);
 n.textContent=text;
 if(cls)n.className=cls;
 return n;
}
async function init(){
 try{
  setStatus("Connecting securely...");
  const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
  db=createClient(URL,KEY);
  const {data:sessionData,error:sessionError}=await timed(
   db.auth.getSession(),"session"
  );
  if(sessionError)throw sessionError;
  user=sessionData.session?.user;
  if(!user){
   setStatus("Please sign in first. Reviewer access is restricted.",true);
   return;
  }

  const {data:admin,error:adminError}=await timed(
   db.from("smart_chama_system_admins")
    .select("user_id").eq("user_id",user.id).maybeSingle(),
   "owner verification"
  );
  if(adminError)throw adminError;
  isOwner=!!admin;

  const {data:roles,error:roleError}=await timed(
   db.from("chama_member_roles")
    .select("group_id,role")
    .eq("user_id",user.id),
   "reviewer verification"
  );
  if(roleError)throw roleError;
  reviewGroupIds=[...new Set((roles||[])
   .filter(r=>["chairperson","secretary"].includes(
    String(r.role||"").trim().toLowerCase().replace(/[\s-]+/g,"_")
   ))
   .map(r=>r.group_id))];

  if(!isOwner&&reviewGroupIds.length===0){
   setStatus("Access denied: your account is not authorized to review membership requests.",true);
   return;
  }

  $("reviewerControls").hidden=false;
  $("requestsCard").hidden=false;
  $("managementLink").hidden=!isOwner;
  setStatus(isOwner
   ?"Authorized system owner. Loading pending requests..."
   :"Authorized reviewer. Loading requests for your group(s)..."
  );
  await loadRequests();
 }catch(e){
  setStatus("Access check failed: "+(e?.message||String(e)),true);
 }
}
async function loadRequests(){
 $("refresh").disabled=true;
 $("requests").textContent="Loading pending requests...";
 try{
  let query=db.from("chama_members")
   .select("id,group_id,user_id,member_number,status,joined_at")
   .eq("status","pending")
   .order("joined_at",{ascending:true});
  if(!isOwner)query=query.in("group_id",reviewGroupIds);
  const {data:members,error}=await timed(query,"pending request loading");
  if(error)throw error;

  const {data:groups,error:groupError}=await timed(
   db.from("chama_groups").select("id,name"),
   "group names"
  );
  if(groupError)throw groupError;
  const names=new Map((groups||[]).map(g=>[g.id,g.name]));
  const target=$("requests");
  target.replaceChildren();

  if(!members?.length){
   target.textContent="No pending membership requests for your authorized groups.";
   setStatus("No pending requests found.");
   return;
  }
  for(const m of members){
   const card=node("article","","request");
   card.appendChild(node("h3",names.get(m.group_id)||"Chama group"));
   card.appendChild(node("p","Membership: "+(m.member_number||"Pending number")));
   card.appendChild(node("p","Requested: "+(m.joined_at?new Date(m.joined_at).toLocaleString():"Unknown")));

   const approve=node("button","Approve");
   approve.addEventListener("click",()=>review(m.id,"approve",approve));
   const reject=node("button","Reject","danger");
   reject.addEventListener("click",()=>review(m.id,"reject",reject));
   card.append(approve,reject);
   target.appendChild(card);
  }
  setStatus(members.length+" pending request(s) loaded for your authorized scope.");
 }catch(e){
  $("requests").textContent="Could not load requests: "+(e?.message||String(e));
  setStatus("Request loading failed: "+(e?.message||String(e)),true);
 }finally{
  $("refresh").disabled=false;
 }
}
async function review(id,decision,button){
 if(!confirm("Confirm "+decision+" for this membership request?"))return;
 button.disabled=true;
 try{
  const {data,error}=await timed(
   db.rpc("review_chama_membership",{
    p_membership_id:id,p_decision:decision
   }),"membership review"
  );
  if(error)throw error;
  setStatus(data||"Review completed.");
  await loadRequests();
 }catch(e){
  setStatus("Review failed: "+(e?.message||String(e)),true);
  button.disabled=false;
 }
}
$("refresh").addEventListener("click",loadRequests);
init();
</script>
</body>
</html>
