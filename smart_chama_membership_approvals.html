
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Chama - Member Registration</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#243247;font:16px Arial,sans-serif}
header{background:#103d30;color:white;padding:24px}
main{max-width:720px;margin:22px auto;padding:14px}
.card{background:white;border-radius:16px;padding:22px;margin-bottom:18px}
.notice{padding:14px;background:#eaf4ee;border-radius:10px;overflow-wrap:anywhere}
.error{background:#ffeded;color:#8c1d1d}
label{display:block;font-weight:bold;margin:16px 0 8px}
select,button,a{font-size:16px}
select{width:100%;padding:14px;border:1px solid #ccd5d1;border-radius:10px}
button,a{display:inline-block;padding:13px 16px;border:0;border-radius:10px;background:#17654c;color:white;text-decoration:none;font-weight:bold;margin:8px 6px 0 0}
.secondary{background:#e8f1ec;color:#103d30}
button:disabled,select:disabled{opacity:.55}
.muted{color:#667085;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>Smart Chama</h1>
<p>Member Registration</p>
</header>
<main>
<section class="card">
<h2>Account</h2>
<div id="status" class="notice">Starting secure connection...</div>
<a class="secondary" href="smart_chama_supabase_ready-2.html">Member Access / Sign in</a>
<a class="secondary" href="smart_chama_main.html">Main System</a>
</section>
<section class="card">
<h2>Request membership</h2>
<p class="muted">Choose a chama and submit your request. Group access begins after approval.</p>
<label for="group">Choose chama</label>
<select id="group" disabled><option>Connecting...</option></select>
<button id="submit" disabled>Submit membership request</button>
<div id="result" class="notice" hidden></div>
</section>
</main>
<script type="module">
const $=id=>document.getElementById(id);
const URL="https://kbrhjgnwbkszmjldbfor.supabase.co";
const KEY="sb_publishable__Tck9HRnjrqdLdbpH36YPQ_-7vpek8B";
let db=null,currentUser=null;

function showStatus(message,error=false){
 $("status").textContent=message;
 $("status").className="notice"+(error?" error":"");
}
function showResult(message,error=false){
 $("result").hidden=false;
 $("result").textContent=message;
 $("result").className="notice"+(error?" error":"");
}
function timed(promise,label,ms=12000){
 return Promise.race([
  promise,
  new Promise((_,reject)=>setTimeout(
   ()=>reject(new Error(label+" timed out. Check your connection and refresh.")),ms))
 ]);
}
async function init(){
 try{
  showStatus("Loading secure database library...");
  const {createClient}=await timed(
   import("https://esm.sh/@supabase/supabase-js@2"),
   "Supabase library loading",20000
  );
  db=createClient(URL,KEY);
  showStatus("Checking your sign-in...");
  const {data,error}=await timed(db.auth.getSession(),"Sign-in check");
  if(error)throw error;
  currentUser=data.session?.user;
  if(!currentUser){
   showStatus("Please sign in using Member Access, then return here.",true);
   $("group").innerHTML="<option>Sign in first</option>";
   return;
  }
  showStatus("Signed in as "+(currentUser.email||currentUser.id));
  const {data:groups,error:groupError}=await timed(
   db.from("chama_groups").select("id,name,description").order("name"),
   "Group loading"
  );
  if(groupError)throw groupError;
  const select=$("group");
  select.innerHTML="";
  if(!groups?.length){
   select.add(new Option("No groups available",""));
   showResult("No chama groups are currently available.",true);
   return;
  }
  select.add(new Option("Select a chama",""));
  groups.forEach(g=>select.add(new Option(
   g.name+(g.description?" — "+g.description:""),g.id
  )));
  select.disabled=false;
  $("submit").disabled=false;
 }catch(e){
  showStatus("Registration error: "+(e?.message||String(e)),true);
  $("group").innerHTML="<option>Could not load groups</option>";
 }
}
$("submit").addEventListener("click",async()=>{
 if(!db||!currentUser){
  showResult("Please sign in first.",true);return;
 }
 const groupId=$("group").value;
 if(!groupId){showResult("Choose a chama first.",true);return;}
 $("submit").disabled=true;
 try{
  const {data,error}=await timed(
   db.rpc("request_chama_membership",{p_group_id:groupId}),
   "Membership request",15000
  );
  if(error)throw error;
  showResult(data||"Request submitted. Await approval.");
 }catch(e){
  showResult("Request failed: "+(e?.message||String(e)),true);
 }finally{$("submit").disabled=false;}
});
init();
</script>
</body>
</html>
