
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Chama - Membership Approvals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#243247;font:16px Arial,sans-serif}
header{background:#103d30;color:white;padding:22px}main{max-width:850px;margin:22px auto;padding:14px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:18px}
h1{margin:0 0 8px}p{line-height:1.5;overflow-wrap:anywhere}
button,a{display:inline-block;padding:12px 15px;border:0;border-radius:10px;background:#17654c;color:white;text-decoration:none;font-weight:bold;margin:8px 6px 0 0;cursor:pointer}
.secondary{background:#e8f1ec;color:#103d30}.danger{background:#a52d2d;color:white}
.notice{padding:14px;background:#eaf4ee;border-radius:10px;overflow-wrap:anywhere}
.error{background:#ffeded;color:#8c1d1d}.muted{color:#667085}
.request{border:1px solid #e0e7e3;border-radius:13px;padding:15px;margin:12px 0}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header><h1>Smart Chama</h1><p>Membership Approval Centre</p></header>
<main>
<section class="card">
<h2>Reviewer access</h2>
<div id="status" class="notice">Checking your sign-in...</div>
<button id="refresh" disabled onclick="loadRequests()">Refresh requests</button>
<a class="secondary" href="smart_chama_group_management.html">Group Management</a>
<a class="secondary" href="smart_chama_main.html">Main System</a>
</section>
<section class="card">
<h2>Pending membership requests</h2>
<p class="muted">The system owner, chairperson, or secretary can review requests. Database functions enforce review permissions.</p>
<div id="requests">Waiting for sign-in...</div>
</section>
</main>
<script>
const URL="https://kbrhjgnwbkszmjldbfor.supabase.co";
const KEY="sb_publishable__Tck9HRnjrqdLdbpH36YPQ_-7vpek8B";
const db=supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let currentUser=null;

function timeout(promise,ms,label){
 return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+" timed out. Refresh and sign in again.")),ms))]);
}
function status(text,error=false){
 $("status").textContent=text;
 $("status").className="notice"+(error?" error":"");
}
function el(tag,text,cls){
 const n=document.createElement(tag);
 n.textContent=text;
 if(cls)n.className=cls;
 return n;
}
async function init(){
 try{
  const {data,error}=await timeout(db.auth.getSession(),12000,"Sign-in check");
  if(error)throw error;
  currentUser=data.session?.user;
  if(!currentUser){
   status("You are not signed in. Open Member Access, sign in, then return here.",true);
   $("requests").textContent="Sign in required.";
   return;
  }
  const {data:owner,error:ownerError}=await timeout(
   db.from("smart_chama_system_admins").select("user_id")
    .eq("user_id",currentUser.id).maybeSingle(),
   12000,"Owner permission check");
  if(ownerError)throw ownerError;
  status(owner
   ?"System owner verified: "+currentUser.email
   :"Signed in as "+currentUser.email+". Database permissions will determine which requests you can review.");
  $("refresh").disabled=false;
  await loadRequests();
 }catch(e){
  status("Approval page could not initialize: "+e.message,true);
  $("requests").textContent="Error: "+e.message;
 }
}
async function loadRequests(){
 if(!currentUser){status("Sign in first.",true);return;}
 $("refresh").disabled=true;
 $("requests").textContent="Loading pending requests...";
 try{
  const {data:members,error:memberError}=await timeout(
   db.from("chama_members")
    .select("id,group_id,user_id,member_number,status,joined_at")
    .eq("status","pending").order("joined_at",{ascending:true}),
   15000,"Pending request loading");
  if(memberError)throw memberError;
  const {data:groups,error:groupError}=await timeout(
   db.from("chama_groups").select("id,name"),
   12000,"Group names loading");
  if(groupError)throw groupError;
  const names=new Map((groups||[]).map(g=>[g.id,g.name]));
  const target=$("requests");
  target.innerHTML="";
  if(!members?.length){
   target.appendChild(el("p","No pending membership requests.","notice"));
   status("No pending requests found.");
   return;
  }
  for(const m of members){
   const card=el("article","","request");
   card.appendChild(el("h3",names.get(m.group_id)||"Chama group"));
   card.appendChild(el("p","Membership: "+(m.member_number||"Pending number")));
   card.appendChild(el("p","User ID: "+m.user_id));
   card.appendChild(el("p","Requested: "+(m.joined_at?new Date(m.joined_at).toLocaleString():"Unknown")));
   const approve=el("button","Approve");
   approve.onclick=()=>review(m.id,"approve",approve);
   const reject=el("button","Reject","danger");
   reject.onclick=()=>review(m.id,"reject",reject);
   card.appendChild(approve);
   card.appendChild(reject);
   target.appendChild(card);
  }
  status(members.length+" pending request(s) loaded.");
 }catch(e){
  $("requests").textContent="Could not load requests: "+e.message;
  status("Approval loading failed: "+e.message,true);
 }finally{$("refresh").disabled=false;}
}
async function review(id,decision,button){
 if(!confirm("Confirm "+decision+" for this membership request?"))return;
 button.disabled=true;
 try{
  const {data,error}=await timeout(db.rpc("review_chama_membership",{
   p_membership_id:id,p_decision:decision
  }),15000,"Membership review");
  if(error)throw error;
  status(data||"Membership review completed.");
  await loadRequests();
 }catch(e){
  status("Review failed: "+e.message,true);
  button.disabled=false;
 }
}
init();
</script>
</body>
</html>
