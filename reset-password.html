
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Chama - Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      margin: 0;
      padding: 24px;
      color: #173b2a;
    }
    .card {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    h2 { margin-top: 0; }
    p { line-height: 1.5; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: 0;
      background: #176b43;
      color: white;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message { overflow-wrap: anywhere; }
    a { color: #176b43; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset your password</h2>
    <p>Enter and confirm your new Smart Chama password.</p>

    <form id="resetForm" hidden>
      <input id="newPassword" type="password"
        placeholder="New password (at least 8 characters)"
        minlength="8" required autocomplete="new-password">
      <input id="confirmPassword" type="password"
        placeholder="Confirm new password"
        minlength="8" required autocomplete="new-password">
      <button id="saveButton" type="submit">Save New Password</button>
    </form>

    <p id="message">Checking your password-reset link...</p>
    <p><a href="https://karkuresl-stack.github.io/Smart-chama/smart_chama_supabase_ready-2.html">Back to Member Access</a></p>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("saveButton");

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let recoveryReady = false;

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        form.hidden = false;
        message.textContent = "Reset link verified. Enter your new password.";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        message.textContent =
          "Your reset link is not verified. Request a fresh link and open it again.";
        return;
      }

      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "Use at least 8 characters.";
        return;
      }

      if (password !== confirmation) {
        message.textContent = "The passwords do not match.";
        return;
      }

      button.disabled = true;
      message.textContent = "Saving your new password...";

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        form.hidden = true;
        message.textContent =
          "Password updated successfully. Return to Member Access and sign in with your new password.";
      } catch (error) {
        message.textContent = "Could not update password: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
