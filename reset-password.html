
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Chama - Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      color: #173b2a;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0002;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: 0;
      background: #176b43;
      color: white;
      font-weight: bold;
    }
    #resetForm[hidden] { display: none; }
    #message { line-height: 1.5; overflow-wrap: anywhere; }
    a { color: #176b43; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset your password</h2>
    <p>Enter and confirm your new Smart Chama password.</p>

    <form id="resetForm" hidden>
      <input id="newPassword" type="password"
        placeholder="New password (at least 8 characters)"
        minlength="8" autocomplete="new-password" required>
      <input id="confirmPassword" type="password"
        placeholder="Confirm new password"
        minlength="8" autocomplete="new-password" required>
      <button id="saveButton" type="submit">Save New Password</button>
    </form>

    <p id="message">Checking your password-reset link...</p>
    <p><a href="https://karkuresl-stack.github.io/Smart-chama/smart_chama_supabase_ready-2.html">Back to Member Access</a></p>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("saveButton");

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          flowType: "implicit",
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    let recoveryReady = false;

    function showRecoveryForm() {
      recoveryReady = true;
      form.hidden = false;
      message.textContent =
        "Recovery link verified. Enter your new password below.";
    }

    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        showRecoveryForm();
      }
    });

    async function checkRecoveryLink() {
      const hash = window.location.hash;
      const params = new URLSearchParams(hash.replace(/^#/, ""));
      const query = new URLSearchParams(window.location.search);

      if (params.get("error") || query.get("error")) {
        message.textContent =
          "This recovery link is invalid or expired. Request a new link later.";
        return;
      }

      if (params.get("access_token") && params.get("refresh_token")) {
        const { error } = await client.auth.setSession({
          access_token: params.get("access_token"),
          refresh_token: params.get("refresh_token")
        });

        if (error) {
          message.textContent =
            "This recovery link is invalid or expired. Request a new link later.";
          return;
        }

        showRecoveryForm();
        return;
      }

      const { data, error } = await client.auth.getSession();

      if (!error && data.session && hash) {
        showRecoveryForm();
        return;
      }

      message.textContent =
        "No recovery link detected. Open this page using the password-reset link from your email. If you have no email, wait for the email limit to clear before requesting another.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        message.textContent =
          "Open a valid password-reset link before setting a new password.";
        return;
      }

      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "Use at least 8 characters.";
        return;
      }

      if (password !== confirm) {
        message.textContent = "The passwords do not match.";
        return;
      }

      button.disabled = true;
      message.textContent = "Saving your new password...";

      const { error } = await client.auth.updateUser({
        password: password
      });

      button.disabled = false;

      if (error) {
        message.textContent = "Password update failed: " + error.message;
        return;
      }

      form.hidden = true;
      message.textContent =
        "Password updated successfully. Return to Member Access and sign in with your new password.";
      history.replaceState(null, "", window.location.pathname);
    });

    checkRecoveryLink();
  </script>
</body>
</html>
